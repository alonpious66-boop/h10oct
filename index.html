<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFTERNET — Galactic Civilization Builder</title>
    <meta name="description" content="AFTERNET — Galactic Civilization Builder" />
    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body>
    <div id="root"></div>

    <script>
      const STORAGE_KEY = 'afternet-save-v1';
      const planetCatalog = [
        { id: 'aurelia-9', name: 'Zephyria', type: 'High-wind', description: 'A high-wind planet with powerful crosswinds and exposed terrain.', features: ['High winds', 'Wind energy', 'Open terrain'], temperature: 18, gravity: 1.04, atmosphere: 'N₂ / O₂ / Ar', water: 82, minerals: 71, energy: 58, radiation: 17, hazards: ['High-wind systems', 'North polar ice quakes'], status: 'Scouted', compatibility: 88, route: 'Asterion corridor' },
        { id: 'selene-7', name: 'Eclipse Prime', type: 'Low-light', description: 'A low-light planet with limited daylight and long shadowed regions.', features: ['Low light', 'Cryogenic terrain', 'Subsurface water'], temperature: -11, gravity: 0.78, atmosphere: 'N₂ / He / CO₂', water: 68, minerals: 80, energy: 31, radiation: 22, hazards: ['Cryovolcanic vents', 'Low-light storms'], status: 'Active outpost', compatibility: 64, route: 'Luna lane' },
        { id: 'vexor-3', name: 'Nexora', type: 'Alien civilization', description: 'An advanced alien civilization world with valuable technology and restricted zones.', features: ['Advanced alien civilization', 'Ancient technology', 'First-contact site'], temperature: 34, gravity: 1.28, atmosphere: 'CO₂ / SO₂ / N₂', water: 19, minerals: 91, energy: 75, radiation: 54, hazards: ['Unmapped defense systems', 'Seismic surges'], status: 'Unmapped', compatibility: 42, route: 'Ash spine' },
        { id: 'thalassa-4', name: 'Edenis', type: 'Terraforming candidate', description: 'A water-rich world and promising candidate for long-term terraforming.', features: ['Terraforming candidate', 'High water', 'Stable atmosphere'], temperature: 23, gravity: 0.92, atmosphere: 'N₂ / O₂ / H₂O vapour', water: 90, minerals: 53, energy: 48, radiation: 13, hazards: ['High-pressure tides', 'Flash floods'], status: 'Scouted', compatibility: 79, route: 'Silver current' },
        { id: 'ember-12', name: 'Solara', type: 'Solar-rich', description: 'A solar-energy-rich world with intense sunlight and exceptional power potential.', features: ['Solar-energy-rich', 'High solar output', 'Solar bursts'], temperature: 41, gravity: 1.11, atmosphere: 'CO₂ / Ar', water: 12, minerals: 74, energy: 88, radiation: 52, hazards: ['Dust cyclones', 'Solar bursts'], status: 'Surveyed', compatibility: 47, route: 'Solar flare lane' },
        { id: 'lynx-18', name: 'Vortex-6', type: 'Storm world', description: 'A volatile world battered by extreme atmospheric storms.', features: ['Extreme atmospheric storms', 'Severe weather', 'Storm shelter needed'], temperature: 15, gravity: 1.12, atmosphere: 'N₂ / O₂ / CH₄', water: 76, minerals: 60, energy: 63, radiation: 16, hazards: ['Extreme atmospheric storms', 'Root-driven sinkholes'], status: 'Scouted', compatibility: 83, route: 'Verdant arc' },
        { id: 'orion-1', name: 'Orion-1', type: 'Terrestrial', description: 'Jemiah’s established homeworld and operational baseline.', features: ['Homeworld', 'Established colony', 'Balanced resources'], temperature: 21, gravity: 1.0, atmosphere: 'N₂ / O₂ / Ar', water: 77, minerals: 58, energy: 61, radiation: 12, hazards: ['Seasonal dust storms'], status: 'Homeworld', compatibility: 92, route: 'Founding ring' }
      ];
      const planetFeatureFilters = ['High winds', 'Solar-energy-rich', 'Advanced alien civilization', 'Extreme atmospheric storms', 'Low light', 'Terraforming candidate'];
      const starchartCoordinates = {
        'orion-1': [68, 142], 'aurelia-9': [220, 70], 'selene-7': [320, 202],
        'vexor-3': [486, 70], 'thalassa-4': [536, 202], 'ember-12': [412, 137], 'lynx-18': [150, 214]
      };

      const speciesCatalog = [
        { id: 'human', name: 'Terran Baseline', description: 'Adaptable and resilient; requires standard atmosphere and moderate gravity.', requirements: { atmosphere: 85, temperature: 65, gravity: 76, water: 70, food: 78, energy: 60, radiation: 72, shelter: 80 } },
        { id: 'nautil', name: 'Nautiloid', description: 'Amphibious and subterranean; thrives in high water availability and shaded, cold terrain.', requirements: { atmosphere: 68, temperature: 52, gravity: 62, water: 92, food: 66, energy: 55, radiation: 80, shelter: 86 } },
        { id: 'aether', name: 'Aether Bloom', description: 'Photosynthetic lattice-form creatures favor high-light, low-radiation worlds with elevated oxygen.', requirements: { atmosphere: 90, temperature: 72, gravity: 70, water: 68, food: 90, energy: 82, radiation: 88, shelter: 72 } }
      ];

      const buildingCatalog = [
        { id: 'habitat', name: 'Residential Habitat', cost: { minerals: 25, water: 8, energy: 14 }, effect: { population: 14, health: 6 } },
        { id: 'medical', name: 'Medical Center', cost: { minerals: 18, energy: 10, water: 6 }, effect: { health: 12 } },
        { id: 'greenhouse', name: 'Greenhouse', cost: { minerals: 22, water: 7, energy: 11 }, effect: { food: 18 } },
        { id: 'water-plant', name: 'Water Purification', cost: { minerals: 20, energy: 7, water: 4 }, effect: { water: 18 } },
        { id: 'oxygen', name: 'Oxygen Generator', cost: { minerals: 16, energy: 12 }, effect: { health: 8 } },
        { id: 'power', name: 'Solar Power Station', cost: { minerals: 26, water: 6, energy: 9 }, effect: { energy: 24 } },
        { id: 'mine', name: 'Mining Facility', cost: { minerals: 28, energy: 12 }, effect: { minerals: 20 } },
        { id: 'lab', name: 'Research Lab', cost: { minerals: 20, energy: 18 }, effect: { sustainability: 8 } },
        { id: 'tower', name: 'Comm Tower', cost: { minerals: 14, energy: 8 }, effect: { trade: 10 } },
        { id: 'shelter', name: 'Defense Shelter', cost: { minerals: 30, energy: 15, water: 8 }, effect: { health: 10, safety: 12 } }
      ];

      const defaultState = {
        civilizationName: 'Jemiah',
        speciesId: 'human',
        selectedPlanetId: 'orion-1',
        comparePlanetId: 'aurelia-9',
        currentMission: 'Habitat survey and landing prep',
        turn: 1,
        recentAlerts: ['High orbit relay restored for the southern wing.', 'Mineral haul queued for the Helios ridge.', 'Water reserve above sustainability threshold.'],
        resources: { water: 86, minerals: 72, food: 78, energy: 68, silicon: 42, rare: 23, population: 26 },
        colonyStats: { population: 26, colonyHealth: 79, sustainability: 82, threat: 'Elevated', habitats: 3, miningStations: 2, activeHabitats: 2, populationCapacity: 44 },
        buildings: ['habitat', 'greenhouse', 'power'],
        tradeRoutes: [{ from: 'Orion-1', to: 'Zephyria', cost: 12, days: 3, status: 'Available' }, { from: 'Orion-1', to: 'Edenis', cost: 18, days: 4, status: 'Available' }, { from: 'Zephyria', to: 'Vortex-6', cost: 14, days: 3, status: 'Queued' }],
        eventLog: [{ label: 'Turn 1', detail: 'Long-range scans identified a stable geothermal pocket on Eclipse Prime.' }, { label: 'Turn 2', detail: 'Settlement nutrient loop is achieving 94% efficiency.' }],
        systemMessage: 'All systems stable. Planetary adaptation model ready for deployment.'
      };

      const clamp = (value, min = 0, max = 100) => Math.min(Math.max(value, min), max);

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return defaultState;
          const restored = JSON.parse(saved);
          return {
            ...restored,
            civilizationName: restored.civilizationName === 'Astra Nova' ? 'Jemiah' : restored.civilizationName,
            comparePlanetId: restored.comparePlanetId || 'aurelia-9'
          };
        } catch (error) {
          return defaultState;
        }
      }

      let state = loadState();
      let serverHabitability = null;
      let serverCompareHabitability = null;
      let backendActionInFlight = false;
      const root = document.getElementById('root');

      function updateActiveNav() {
        const validHashes = ['#sector-starchart', '#planet-survey', '#colony-grid', '#trade-matrix'];
        const activeHash = validHashes.includes(window.location.hash) ? window.location.hash : '#sector-starchart';
        document.querySelectorAll('.command-nav a').forEach((link) => {
          const active = link.getAttribute('href') === activeHash;
          link.classList.toggle('nav-active', active);
          if (active) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        });
      }

      function getSelectedPlanet() {
        return planetCatalog.find((planet) => planet.id === state.selectedPlanetId) || planetCatalog[0];
      }

      function getComparePlanet() {
        return planetCatalog.find((planet) => planet.id === state.comparePlanetId) || planetCatalog[0];
      }

      function getSelectedSpecies() {
        return speciesCatalog.find((species) => species.id === state.speciesId) || speciesCatalog[0];
      }

      function calculateCompatibility(planet, species) {
        const atmosphereScore = clamp(100 - Math.abs((planet.atmosphere.includes('O₂') ? 84 : 46) - species.requirements.atmosphere));
        const tempScore = clamp(100 - Math.abs(planet.temperature - 21) * 2.5);
        const gravityScore = clamp(100 - Math.abs((planet.gravity * 100) - 100) * 1.6);
        const waterScore = clamp(Math.min(100, planet.water + 20 - Math.max(0, species.requirements.water - 60)));
        const foodScore = clamp(planet.water * 0.75 + planet.energy * 0.4);
        const energyScore = clamp(planet.energy + (planet.type === 'Desert' ? 18 : 0));
        const safetyScore = clamp(100 - planet.radiation * 1.2 - planet.hazards.length * 6);
        return Math.round(atmosphereScore * 0.22 + tempScore * 0.18 + gravityScore * 0.12 + waterScore * 0.16 + foodScore * 0.12 + energyScore * 0.1 + safetyScore * 0.1);
      }

      function buildCompatibilityData(planet, species) {
        return [
          { name: 'Atmosphere', value: clamp(100 - Math.abs((planet.atmosphere.includes('O₂') ? 84 : 46) - species.requirements.atmosphere)) },
          { name: 'Temperature', value: clamp(100 - Math.abs(planet.temperature - 21) * 2.5) },
          { name: 'Gravity', value: clamp(100 - Math.abs((planet.gravity * 100) - 100) * 1.6) },
          { name: 'Water', value: clamp(Math.min(100, planet.water + 20 - Math.max(0, species.requirements.water - 60))) },
          { name: 'Food', value: clamp(planet.water * 0.75 + planet.energy * 0.4) },
          { name: 'Energy', value: clamp(planet.energy + (planet.type === 'Desert' ? 18 : 0)) },
          { name: 'Safety', value: clamp(100 - planet.radiation * 1.2 - planet.hazards.length * 6) }
        ];
      }

      function getRecommendation(score) {
        if (score >= 75) return 'Suitable';
        if (score >= 55) return 'Suitable with Infrastructure';
        return 'Unsuitable';
      }

      function getStatusClass(status) {
        if (status === 'Suitable') return 'status-good';
        if (status === 'Suitable with Infrastructure') return 'status-warn';
        return 'status-danger';
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      async function requestApi(path, payload) {
        const apiBase = window.location.port === '4173' ? 'http://localhost:3001' : '';
        const response = await fetch(`${apiBase}${path}`, {
          method: payload ? 'POST' : 'GET',
          headers: payload ? { 'Content-Type': 'application/json' } : {},
          body: payload ? JSON.stringify(payload) : undefined
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `Request failed (${response.status}).`);
        return result;
      }

      async function initializeBackend() {
        try {
          const result = await requestApi('/api/state');
          if (!result.initialized) {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
              try {
                const migrated = await requestApi('/api/save', { state: JSON.parse(saved) });
                state = migrated.state;
              } catch (error) {
                console.warn('Could not migrate local save to backend:', error);
                state = result.state;
              }
            } else {
              state = result.state;
            }
          } else {
            state = result.state;
          }
          saveState();
          await refreshHabitability();
          render();
        } catch (error) {
          state.systemMessage = `Backend unavailable: ${error.message}`;
          render();
        }
      }

      async function applyBackendAction(path, payload) {
        if (backendActionInFlight) return;
        backendActionInFlight = true;
        render();
        try {
          const result = await requestApi(path, payload);
          state = result.state;
          saveState();
          await refreshHabitability();
        } catch (error) {
          state.systemMessage = `Backend action failed: ${error.message}`;
          saveState();
        } finally {
          backendActionInFlight = false;
        }
        render();
      }

      async function refreshHabitability() {
        try {
          const results = await Promise.all([
            requestApi('/api/habitability/calculate', { planetId: state.selectedPlanetId, speciesId: state.speciesId }),
            requestApi('/api/habitability/calculate', { planetId: state.comparePlanetId || 'aurelia-9', speciesId: state.speciesId })
          ]);
          [serverHabitability, serverCompareHabitability] = results;
        } catch (error) {
          state.systemMessage = `Habitability calculation failed: ${error.message}`;
        }
      }

      function render() {
        const selectedPlanet = getSelectedPlanet();
        const selectedSpecies = getSelectedSpecies();
        const serverCurrentMatches = serverHabitability?.planetId === selectedPlanet.id && serverHabitability?.speciesId === selectedSpecies.id;
        const serverCompareMatches = serverCompareHabitability?.planetId === state.comparePlanetId && serverCompareHabitability?.speciesId === selectedSpecies.id;
        const compatibilityScore = serverCurrentMatches ? serverHabitability.score : calculateCompatibility(selectedPlanet, selectedSpecies);
        const comparePlanet = getComparePlanet();
        const compareCompatibility = serverCompareMatches ? serverCompareHabitability.score : calculateCompatibility(comparePlanet, selectedSpecies);
        const recommendation = getRecommendation(compatibilityScore);
        const compatibilityData = serverCurrentMatches ? serverHabitability.factors : buildCompatibilityData(selectedPlanet, selectedSpecies);
        const compareFactors = serverCompareMatches ? serverCompareHabitability.factors : buildCompatibilityData(comparePlanet, selectedSpecies);

        root.innerHTML = `
          <div class="app-shell">
            <div class="page-wrap">
              <header class="topbar glass-panel">
                <div class="brand-wrap">
                  <div class="brand-mark">◆</div>
                  <div>
                    <p class="eyebrow">${state.civilizationName} // Galactic</p>
                    <h1>Command</h1>
                  </div>
                </div>
                <div class="status-strip">
                  <div class="telemetry-cell"><span>Cycle</span><strong>${state.turn}</strong></div>
                  <div class="telemetry-cell"><span>Tier III</span><strong>Interstellar</strong></div>
                  <div class="telemetry-cell"><span>Energy</span><strong>${state.resources.energy} <small>GW</small></strong></div>
                  <div class="telemetry-cell"><span>Population</span><strong>${state.colonyStats.population}</strong></div>
                  <div class="telemetry-cell threat-readout"><span>Threat</span><strong>${state.colonyStats.threat}</strong></div>
                </div>
              </header>

              <nav class="command-nav">
                <a href="#sector-starchart">Sector starchart</a>
                <a href="#planet-survey">Planetary survey</a>
                <a href="#colony-grid">Colony grid</a>
                <a href="#trade-matrix">Trade &amp; defense matrix</a>
              </nav>

              <div class="defense-banner glass-panel">
                <div>
                  <strong><span class="online-dot"></span> Defense / logistics matrix synced</strong>
                  <small>Active freight corridors: ${state.tradeRoutes.length} secure / ${state.tradeRoutes.filter((route) => route.status === 'Queued').length} queued</small>
                </div>
                <div class="banner-actions">
                  <button class="secondary-btn" data-action="calibrate">Calibrate telemetry</button>
                  <button class="danger-btn" data-action="emergency">Emergency protocol · advance 5</button>
                </div>
              </div>

              <div class="main-grid">
                <aside class="sidebar">
                  <div class="glass-panel panel-block">
                    <div class="panel-header">
                      <h2>System</h2>
                      <span class="online-dot"></span>
                    </div>
                    <ul class="system-list">
                      <li><span>🛰️ Explore</span><span>${selectedPlanet.name}</span></li>
                      <li><span>⛏️ Mining</span><span>${state.colonyStats.miningStations} stations</span></li>
                      <li><span>🏙️ Habitats</span><span>${state.colonyStats.activeHabitats} active</span></li>
                      <li><span>📦 Trade</span><span>${state.tradeRoutes.length} routes</span></li>
                      <li><span>🛡️ Defense</span><span>Orbit shield online</span></li>
                    </ul>
                  </div>

                  <div class="glass-panel panel-block">
                    <h3>Recent alerts</h3>
                    <div class="alert-list">
                      ${state.recentAlerts.map((alert) => `<div class="alert-card">${alert}</div>`).join('')}
                    </div>
                  </div>
                </aside>

                <main class="content">
                  <div class="stats-grid">
                    ${['Water', 'Minerals', 'Food', 'Energy'].map((label) => {
                      const map = { Water: 'water', Minerals: 'minerals', Food: 'food', Energy: 'energy' };
                      const key = map[label];
                      const accent = { Water: 'cyan', Minerals: 'blue', Food: 'emerald', Energy: 'violet' }[label];
                      const value = state.resources[key];
                      return `
                        <div class="glass-panel stat-card">
                          <div class="stat-head"><span>${label}</span><span class="dot dot-${accent}"></span></div>
                          <div class="stat-value">${value}</div>
                          <div class="progress-bar"><div class="fill fill-${accent}" style="width: ${Math.min(100, value)}%"></div></div>
                        </div>
                      `;
                    }).join('')}
                  </div>

                  <div class="hero-grid">
                    <div class="glass-panel panel-large survey-panel" id="planet-survey">
                      <div class="panel-topline">
                        <div>
                          <p class="eyebrow">Planetary survey / selected world</p>
                          <h2>${selectedPlanet.name}</h2>
                        </div>
                        <div class="status-pill ${getStatusClass(recommendation)}">${recommendation}</div>
                      </div>

                      <div class="planet-layout">
                        <div class="planet-visual starchart-visual" id="sector-starchart">
                          <div class="starchart-heading"><span>SECTOR 07 / HYPERLANE CHART</span><span>${planetCatalog.length} SYSTEMS · ${state.tradeRoutes.length} ACTIVE LINKS</span></div>
                          <svg class="route-map sector-map" viewBox="0 0 620 270" role="group" aria-label="Interactive sector starchart. Select a planet to open its survey.">
                            <defs><radialGradient id="starchartGlow"><stop stop-color="#16d9e8" stop-opacity=".12"></stop><stop offset="1" stop-color="#07101c" stop-opacity="0"></stop></radialGradient></defs>
                            <circle cx="300" cy="135" r="128" fill="url(#starchartGlow)"></circle>
                            ${state.tradeRoutes.map((route, index) => {
                              const from = planetCatalog.find((planet) => planet.name === route.from);
                              const to = planetCatalog.find((planet) => planet.name === route.to);
                              if (!from || !to) return '';
                              const [x1, y1] = starchartCoordinates[from.id];
                              const [x2, y2] = starchartCoordinates[to.id];
                              return `<line class="star-route ${route.status === 'Queued' ? 'queued' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`;
                            }).join('')}
                            ${planetCatalog.map((planet) => {
                              const [x, y] = starchartCoordinates[planet.id];
                              const selected = state.selectedPlanetId === planet.id;
                              const label = planet.name === 'Eclipse Prime' ? 'ECLIPSE' : planet.name.toUpperCase();
                              return `<g data-planet="${planet.id}" class="star-node ${selected ? 'selected' : ''}" transform="translate(${x} ${y})" role="button" tabindex="0" aria-label="Select ${planet.name}, ${planet.type}"><circle class="star-node-halo" r="${selected ? 17 : 12}"></circle><circle class="${planet.id === 'orion-1' ? 'route-node route-home' : 'route-node'}" r="${selected ? 6 : 4.5}"></circle><text y="22">${label}</text><title>${planet.name} · ${planet.type}</title></g>`;
                            }).join('')}
                          </svg>
                          <div class="starchart-legend"><span><i class="legend-dot home"></i>Homeworld</span><span><i class="legend-dot"></i>Survey target</span><span><i class="legend-line"></i>Trade corridor</span><span><i class="legend-line queued"></i>Queued route</span></div>
                        </div>

                        <div class="planet-meta">
                          <p class="survey-description">${selectedPlanet.description}</p>
                          <div class="survey-facts"><span>${selectedPlanet.type}</span><span>${selectedPlanet.status}</span><span>${selectedPlanet.hazards.length} hazard signatures</span></div>
                          <div class="mini-grid">
                            <div class="mini-box"><span>Temperature</span><strong>${selectedPlanet.temperature}°C</strong></div>
                            <div class="mini-box"><span>Gravity</span><strong>${selectedPlanet.gravity}g</strong></div>
                            <div class="mini-box"><span>Water</span><strong>${selectedPlanet.water}%</strong></div>
                            <div class="mini-box"><span>Energy</span><strong>${selectedPlanet.energy}%</strong></div>
                            <div class="mini-box"><span>Minerals</span><strong>${selectedPlanet.minerals}%</strong></div>
                            <div class="mini-box"><span>Radiation</span><strong>${selectedPlanet.radiation}%</strong></div>
                          </div>
                          <div class="compat-box">
                            <div class="compat-header"><span>Compatibility score</span><strong>${compatibilityScore}/100</strong></div>
                            <div class="progress-bar"><div class="fill fill-cyan" style="width:${compatibilityScore}%"></div></div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="glass-panel panel-stack radar-panel">
                      <div class="panel-header tight">
                        <p class="eyebrow">Tactical defense / sentry grid</p>
                        <h3>Orbital threat detection</h3>
                      </div>
                      <div class="radar-display" role="img" aria-label="Orbital radar with a rotating scan sweep and moving threat contacts"><span class="radar-sweep"></span><span class="radar-ping ping-one"></span><span class="radar-ping ping-two"></span><span class="radar-ping ping-three"></span><span class="radar-center">◆</span></div>
                      <div class="mission-stack">
                        <div class="mission-card alert-card-critical">${selectedPlanet.hazards[0]} · ${state.colonyStats.threat} threat</div>
                        <div class="mission-card" aria-live="polite">${backendActionInFlight ? 'Defense command in progress…' : state.currentMission}</div>
                        <button class="secondary-btn" data-action="scan" ${backendActionInFlight ? 'disabled' : ''}>Scan hazards</button>
                        <button class="secondary-btn" data-action="shelter" ${backendActionInFlight || state.buildings.includes('shelter') ? 'disabled' : ''}>${state.buildings.includes('shelter') ? 'Defense shelter online' : 'Deploy defense shelter · 30 minerals / 15 energy'}</button>
                        <button class="danger-btn" data-action="evacuate" ${backendActionInFlight || state.colonyStats.population <= 1 ? 'disabled' : ''}>Evacuate up to 5 residents</button>
                        <button class="primary-btn" data-action="explore" ${backendActionInFlight ? 'disabled' : ''}>Launch exploration · 10 energy</button>
                        <button class="secondary-btn" data-action="mine" ${backendActionInFlight ? 'disabled' : ''}>Deploy mining sweep · 12 energy</button>
                      </div>
                    </div>
                  </div>

                  <div class="two-col planet-systems" id="planet-explorer">
                    <div class="glass-panel panel-block comparison-panel">
                      <div class="panel-header tight">
                        <p class="eyebrow">Planet explorer</p>
                        <h3>Discovered systems</h3>
                      </div>
                      <label class="planet-search">
                        <span>Search planets</span>
                        <input id="planetSearch" type="search" placeholder="Search winds, light, storms, energy, water..." />
                      </label>
                      <label class="planet-search planet-feature-filter">
                        <span>Filter by feature</span>
                        <select id="planetFeatureFilter">
                          <option value="">All planetary features</option>
                          ${planetFeatureFilters.map((feature) => `<option value="${feature}">${feature}</option>`).join('')}
                        </select>
                      </label>
                      <div class="planet-grid">
                        ${planetCatalog.map((planet) => `
                          <button class="planet-card ${state.selectedPlanetId === planet.id ? 'active' : ''}" data-planet="${planet.id}" data-search="${`${planet.name} ${planet.type} ${planet.status} ${planet.description} ${planet.features.join(' ')} ${planet.hazards.join(' ')} ${planet.atmosphere} ${planet.route}`.toLowerCase()}" data-features="${planet.features.join('|').toLowerCase()}">
                            <div class="planet-card-top"><span>${planet.name}</span><small>${planet.type}</small></div>
                            <p class="planet-card-description">${planet.description}</p>
                            <div class="planet-feature-tags">${planet.features.map((feature) => `<span>${feature}</span>`).join('')}</div>
                            <small>${planet.status}</small>
                            <div class="progress-bar tiny"><div class="fill fill-cyan" style="width:${calculateCompatibility(planet, selectedSpecies)}%"></div></div>
                          </button>
                        `).join('')}
                      </div>
                      <p id="planetEmptyState" class="empty-state" hidden>No planets match those search filters.</p>
                    </div>

                    <div class="glass-panel panel-block comparison-panel">
                      <p class="eyebrow">World analysis</p>
                      <h3 class="section-title">Planet adaptability comparison</h3>
                      <p class="comparison-caption">Choose any world and compare ${selectedSpecies.name} adaptability, atmosphere, temperature, gravity, water, energy, minerals, and radiation.</p>
                      <div class="compare-select-row">
                        <div class="compare-planet-name"><span>Current planet</span><strong>${selectedPlanet.name}</strong></div>
                        <label class="compare-select">
                          <span>Compare with</span>
                          <select id="comparePlanetSelect">
                            ${planetCatalog.map((planet) => `<option value="${planet.id}" ${state.comparePlanetId === planet.id ? 'selected' : ''}>${planet.name} — ${planet.type}</option>`).join('')}
                          </select>
                        </label>
                      </div>
                      <div class="comparison-score-grid">
                        ${[{ planet: selectedPlanet, score: compatibilityScore }, { planet: comparePlanet, score: compareCompatibility }].map(({ planet, score }) => `
                          <div class="comparison-score">
                            <div class="comparison-score-head"><strong>${planet.name}</strong><span>${getRecommendation(score)}</span></div>
                            <div class="progress-bar"><div class="fill fill-cyan" style="width:${score}%"></div></div>
                            <strong class="comparison-number">${score}<small>/100 adaptability</small></strong>
                          </div>
                        `).join('')}
                      </div>
                      <div class="comparison-factors">
                        ${compatibilityData.map((factor, index) => `
                          <div class="comparison-factor">
                            <span>${factor.name}</span><strong>${Math.round(factor.value)}</strong>
                            <div class="progress-bar tiny"><div class="fill fill-blue" style="width:${factor.value}%"></div></div>
                            <strong>${Math.round(compareFactors[index].value)}</strong>
                          </div>
                        `).join('')}
                      </div>
                      <div class="comparison-resources">
                        <span>Resources</span>
                        <span>${selectedPlanet.water}% water · ${selectedPlanet.minerals}% minerals · ${selectedPlanet.energy}% energy</span>
                        <span>${comparePlanet.water}% water · ${comparePlanet.minerals}% minerals · ${comparePlanet.energy}% energy</span>
                      </div>
                    </div>

                    <div class="glass-panel panel-block">
                      <p class="eyebrow">Habitation assessment</p>
                      <div class="assessment-stack">
                        <div class="assessment-box">
                          <div class="select-row">
                            <span>Civilization profile</span>
                            <select id="speciesSelect">
                              ${speciesCatalog.map((species) => `<option value="${species.id}" ${state.speciesId === species.id ? 'selected' : ''}>${species.name}</option>`).join('')}
                            </select>
                          </div>
                          <p>${selectedSpecies.description}</p>
                        </div>

                        <div class="assessment-box">
                          <div class="compat-header"><span>Compatibility factors</span><strong>${compatibilityScore}/100</strong></div>
                          <div class="factor-list">
                            ${compatibilityData.map((factor) => `
                              <div class="factor-item">
                                <div class="factor-row"><span>${factor.name}</span><span>${Math.round(factor.value)}</span></div>
                                <div class="progress-bar tiny"><div class="fill fill-blue" style="width:${factor.value}%"></div></div>
                              </div>
                            `).join('')}
                          </div>
                        </div>
                        ${serverCurrentMatches ? `
                          <div class="assessment-box adaptation-guidance">
                            <strong>Adaptation plan</strong>
                            <ul>${serverHabitability.adaptations.map((item) => `<li>${item}</li>`).join('')}</ul>
                          </div>
                        ` : ''}
                      </div>
                    </div>
                  </div>

                  <div class="two-col compact resource-logistics">
                    <div class="glass-panel panel-block">
                      <div class="panel-header tight">
                        <p class="eyebrow">Resource mining</p>
                        <h3>Extraction matrix</h3>
                      </div>
                      <div class="turn-controls">
                        <button class="advance-btn" data-action="advance-turn">Advance turn</button>
                        <button class="fast-forward-btn" data-action="advance-five">Advance 5 turns</button>
                      </div>
                      <div class="resource-grid">
                        ${[
                          { key: 'water', label: 'Water Ice', gain: '+16', cost: 8 },
                          { key: 'minerals', label: 'Minerals', gain: '+18', cost: 10 },
                          { key: 'silicon', label: 'Silicon', gain: '+15', cost: 12 },
                          { key: 'rare', label: 'Rare Ore', gain: '+10', cost: 16 }
                        ].map((item) => `
                          <button class="resource-card" data-mine="${item.key}">
                            <div class="resource-head"><span>${item.label}</span><small>${item.gain}</small></div>
                            <small>Energy cost: ${item.cost}</small>
                          </button>
                        `).join('')}
                      </div>
                    </div>

                      <div class="glass-panel panel-block cargo-panel trade-defense-panel" id="trade-matrix">
                        <div class="panel-header tight">
                          <div><p class="eyebrow">Operations / sector coordination</p><h3>Trade &amp; defense matrix</h3></div>
                          <span class="matrix-live"><i class="online-dot"></i> LIVE</span>
                        </div>
                        <div class="matrix-readouts">
                          <div><span>TRADE LANES</span><strong>${state.tradeRoutes.length}</strong></div>
                          <div><span>QUEUED</span><strong>${state.tradeRoutes.filter((route) => route.status === 'Queued').length}</strong></div>
                          <div><span>SECTOR THREAT</span><strong class="threat-value">${state.colonyStats.threat}</strong></div>
                          <div><span>DEFENSE GRID</span><strong>${state.buildings.includes('shelter') ? 'SHIELDED' : 'STANDBY'}</strong></div>
                        </div>
                        <div class="trade-defense-layout">
                          <div class="route-list">
                            <div class="cargo-table-head"><span>TRADE CORRIDOR</span><span>CARGO</span><span>ETA</span><span>SECURITY</span></div>
                            ${state.tradeRoutes.map((route) => `
                              <div class="cargo-row">
                                <span>${route.from} → ${route.to}</span><span>${route.cost} units · ${route.status}</span>
                                <span>${route.days} days</span><span class="${route.status === 'Queued' ? 'cargo-status-warn' : 'cargo-status-safe'}">${route.status === 'Queued' ? 'MONITOR' : 'SECURE'}</span>
                              </div>
                            `).join('')}
                            <button class="primary-btn" data-action="dispatch">Dispatch cargo</button>
                          </div>
                          <div class="defense-matrix-card">
                            <div class="defense-matrix-heading"><span>DEFENSE SECTOR</span><strong>${selectedPlanet.name}</strong></div>
                            <div class="defense-threat-line"><span class="threat-indicator"></span>${selectedPlanet.hazards[0]}</div>
                            <div class="defense-matrix-stats">
                              <span>Threat level<strong>${state.colonyStats.threat}</strong></span>
                              <span>Population<strong>${state.colonyStats.population} protected</strong></span>
                              <span>Shield status<strong>${state.buildings.includes('shelter') ? 'SHELTER ACTIVE' : 'NO SHELTER'}</strong></span>
                            </div>
                            <div class="defense-matrix-actions">
                              <button class="secondary-btn" data-action="scan" ${backendActionInFlight ? 'disabled' : ''}>Scan sector</button>
                              ${!state.buildings.includes('shelter') ? `<button class="secondary-btn" data-action="shelter" ${backendActionInFlight ? 'disabled' : ''}>Deploy shelter</button>` : ''}
                            </div>
                          </div>
                        </div>
                      </div>
                  </div>

                  <div class="two-col compact colony-grid-row">
                    <div class="glass-panel panel-block colony-panel" id="colony-grid">
                      <div class="panel-header tight">
                        <div><p class="eyebrow">Colony sector / Jemiah Prime</p><h3>Colony grid</h3></div>
                        <span class="colony-grid-count">${state.buildings.length} / ${buildingCatalog.length} sites online</span>
                      </div>
                      <div class="colony-site-grid">
                        ${buildingCatalog.map((structure, index) => {
                          const built = state.buildings.includes(structure.id);
                          return `<div class="colony-site ${built ? 'built' : 'vacant'}">
                            <span class="site-coordinate">${String.fromCharCode(65 + Math.floor(index / 5))}${(index % 5) + 1}</span>
                            <span class="site-symbol">${built ? '◆' : '◇'}</span>
                            <strong>${structure.name}</strong>
                            <small>${built ? 'ONLINE' : 'AVAILABLE PAD'}</small>
                            ${!built ? `<button data-build="${structure.id}">Construct</button>` : ''}
                          </div>`;
                        }).join('')}
                      </div>
                      <p class="colony-grid-caption">Operational sites are highlighted. Select an available pad to construct the facility.</p>
                      <details class="construction-details">
                        <summary>View construction costs</summary>
                      <div class="construction-grid">
                        ${buildingCatalog.map((structure) => `
                          <div class="structure-card">
                            <div class="structure-head"><span>${structure.name}</span><button data-build="${structure.id}">Build</button></div>
                            <small>Cost: ${Object.entries(structure.cost).map(([key, value]) => `${key} ${value}`).join(' · ')}</small>
                          </div>
                        `).join('')}
                      </div>
                      </details>
                    </div>

                    <div class="glass-panel panel-block">
                      <p class="eyebrow">Colony health</p>
                      <div class="health-stack">
                        <div class="bar-group">
                          <div class="bar-label"><span>Population</span><strong>${state.colonyStats.population}/${state.colonyStats.populationCapacity}</strong></div>
                          <div class="progress-bar"><div class="fill fill-emerald" style="width:${(state.colonyStats.population / state.colonyStats.populationCapacity) * 100}%"></div></div>
                        </div>
                        <div class="bar-group">
                          <div class="bar-label"><span>Health</span><strong>${state.colonyStats.colonyHealth}%</strong></div>
                          <div class="progress-bar"><div class="fill fill-amber" style="width:${state.colonyStats.colonyHealth}%"></div></div>
                        </div>
                        <div class="bar-group">
                          <div class="bar-label"><span>Sustainability</span><strong>${state.colonyStats.sustainability}%</strong></div>
                          <div class="progress-bar"><div class="fill fill-violet" style="width:${state.colonyStats.sustainability}%"></div></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="chart-grid">
                    <div class="glass-panel panel-block chart-panel">
                      <p class="eyebrow">Resource balance</p>
                      <svg viewBox="0 0 360 200" class="chart-svg">
                        ${(() => {
                          const values = ['water', 'minerals', 'food', 'energy', 'silicon', 'rare'].map((key) => state.resources[key]);
                          const max = Math.max(...values, 1);
                          return values.map((value, idx) => {
                            const barHeight = (value / max) * 140;
                            const x = 30 + idx * 52;
                            const y = 170 - barHeight;
                            return `<g><rect x="${x}" y="${y}" width="40" height="${barHeight}" rx="8" fill="#67e8f9" opacity="0.9"></rect><text x="${x + 20}" y="190" text-anchor="middle" fill="#cbd5e1" font-size="10">${['water', 'minerals', 'food', 'energy', 'silicon', 'rare'][idx].slice(0, 4)}</text></g>`;
                          }).join('');
                        })()}
                      </svg>
                    </div>

                    <div class="glass-panel panel-block chart-panel">
                      <p class="eyebrow">Colony pulse</p>
                      <svg viewBox="0 0 360 200" class="chart-svg">
                        ${(() => {
                          const tradeValues = [state.resources.water, state.resources.minerals, state.resources.food, state.resources.energy];
                          const max = Math.max(...tradeValues, 1);
                          const points = tradeValues.map((value, idx) => {
                            const x = 30 + (idx * 260) / (tradeValues.length - 1 || 1);
                            const y = 170 - (value / max) * 120;
                            return `${x},${y}`;
                          }).join(' ');
                          return `<defs><linearGradient id="pulseGradient" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8"></stop><stop offset="100%" stop-color="#a78bfa" stop-opacity="0.08"></stop></linearGradient></defs><polyline points="${points}" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline><polygon points="30,170 ${points} 330,170" fill="url(#pulseGradient)" opacity="0.8"></polygon>`;
                        })()}
                      </svg>
                    </div>
                  </div>

                  <div class="bottom-grid">
                    <div class="glass-panel panel-block">
                      <p class="eyebrow">System message</p>
                      <div class="system-banner">${state.systemMessage}</div>
                    </div>

                    <div class="glass-panel panel-block">
                      <p class="eyebrow">Event log</p>
                      <div class="event-list">
                        ${state.eventLog.map((event) => `
                          <div class="event-item">
                            <span>${event.label}</span>
                            <p>${event.detail}</p>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                </main>
              </div>
              <footer class="command-footer">
                <span>Galactic civilization matrix // system core v3.4</span>
                <span><i class="online-dot"></i> Telemetry link synchronized</span>
                <span>Encryption quantum polarized</span>
              </footer>
            </div>
          </div>
        `;

        updateActiveNav();
        const speciesSelect = document.getElementById('speciesSelect');
        if (speciesSelect) {
          speciesSelect.onchange = (event) => applyBackendAction('/api/selection', { speciesId: event.target.value });
        }
        const compareSelect = document.getElementById('comparePlanetSelect');
        if (compareSelect) {
          compareSelect.onchange = (event) => applyBackendAction('/api/selection', { comparePlanetId: event.target.value });
        }
        const planetSearch = document.getElementById('planetSearch');
        const planetFeatureFilter = document.getElementById('planetFeatureFilter');
        const applyPlanetFilters = () => {
          const query = (planetSearch?.value || '').trim().toLowerCase();
          const feature = (planetFeatureFilter?.value || '').trim().toLowerCase();
          document.querySelectorAll('[data-planet]').forEach((planet) => {
            const matchesSearch = planet.getAttribute('data-search').includes(query);
            const matchesFeature = !feature || planet.getAttribute('data-features').split('|').some((item) => item.includes(feature));
            planet.hidden = !matchesSearch || !matchesFeature;
          });
          const emptyState = document.getElementById('planetEmptyState');
          if (emptyState) emptyState.hidden = document.querySelectorAll('[data-planet]:not([hidden])').length > 0;
        };
        if (planetSearch) planetSearch.oninput = applyPlanetFilters;
        if (planetFeatureFilter) planetFeatureFilter.onchange = applyPlanetFilters;
      }

      function startMission(type) {
        applyBackendAction('/api/missions/launch', { planetId: state.selectedPlanetId, type });
      }

      function mineResource(resourceKey) {
        applyBackendAction('/api/mining/extract', { resource: resourceKey });
      }

      function buildStructure(structureId) {
        applyBackendAction('/api/colony/build', { structureId });
      }

      function advanceTurn(turnCount = 1) {
        applyBackendAction('/api/simulation/advance', { turns: turnCount });
      }

      function dispatchCargo() {
        applyBackendAction('/api/trade/dispatch', {});
      }

      document.addEventListener('click', (event) => {
        const planetButton = event.target.closest('[data-planet]');
        if (planetButton) {
          applyBackendAction('/api/selection', { planetId: planetButton.getAttribute('data-planet') });
          return;
        }

        const action = event.target.closest('[data-action]');
        if (action) {
          const value = action.getAttribute('data-action');
          if (value === 'explore') startMission('explore');
          if (value === 'mine') startMission('mine');
          if (value === 'advance-turn') advanceTurn();
          if (value === 'advance-five') advanceTurn(5);
          if (value === 'dispatch') dispatchCargo();
          if (value === 'calibrate') applyBackendAction('/api/system/calibrate', {});
          if (value === 'emergency') applyBackendAction('/api/simulation/advance', { turns: 5 });
          if (value === 'shelter' || value === 'evacuate' || value === 'scan') applyBackendAction('/api/defense/action', { action: value });
          return;
        }

        const mineButton = event.target.closest('[data-mine]');
        if (mineButton) {
          mineResource(mineButton.getAttribute('data-mine'));
          return;
        }

        const buildButton = event.target.closest('[data-build]');
        if (buildButton) {
          buildStructure(buildButton.getAttribute('data-build'));
        }
      });

      document.addEventListener('keydown', (event) => {
        const node = event.target.closest('.star-node[data-planet]');
        if (node && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          applyBackendAction('/api/selection', { planetId: node.getAttribute('data-planet') });
        }
      });
      window.addEventListener('hashchange', updateActiveNav);

      render();
      initializeBackend();
    </script>
  </body>
</html>
